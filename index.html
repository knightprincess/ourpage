<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#241f36; 
  --ink-soft:#5b5273; 
  --paper:#F9F5F6;       
  --paper-2:#F8E8EE;     
  --line:#FDCEDF;        
  --mica:#d4587a; 
  --tati:#c98a2e;
  --mica-wash:rgba(212,88,122,.10); 
  --tati-wash:rgba(201,138,46,.12);
  --accent:#b7a6ef;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 18px 40px -22px rgba(0,0,0, 0.05); 
  --radius:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}

:root[data-theme="dark"]{
  --ink:#ece7f5; 
  --ink-soft:#a79ac4; 
  --paper:#222831;       
  --paper-2:#393E46;     
  --line:#332c53;
  --mica:#f09ab2; 
  --tati:#f0bd6a; 
  --mica-wash:rgba(240,154,178,.10); 
  --tati-wash:rgba(240,189,106,.10);
  --accent:#b7a6ef; 
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 18px 40px -22px rgba(0,0,0,.9);
}
  
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased; transition: background 0.3s, color 0.3s;}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(70% 45% at 12% 0%, var(--mica-wash), transparent 70%),
             radial-gradient(60% 40% at 92% 8%, var(--tati-wash), transparent 70%)}
.wrap{position:relative;z-index:1;width:100%;max-width:720px;margin:0 auto;padding:22px 18px 80px}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:400;margin:0;letter-spacing:-.01em}
p{margin:0 0 .8em}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.hidden{display:none !important}

.lang{position:relative; display:inline-flex; align-items:center; gap:8px;}
.lang-btn, .theme-btn{background:transparent;border:1px solid var(--line);border-radius:999px;color:var(--ink-soft);
  padding:5px 11px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.82rem; height: 32px;}
.lang-btn svg, .theme-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
.lang-menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--paper-2);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);overflow:hidden;z-index:20;min-width:140px}
.lang-menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--ink);padding:9px 14px;font-size:.9rem}
.lang-menu button:hover{background:var(--paper)}
.lang-menu button[aria-current="true"]{color:var(--accent);font-weight:500}

.login{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:26px}
.login-top{display:flex;justify-content:flex-end}
.eyebrow{font-size:.82rem;color:var(--ink-soft);margin:0}
.login h1{font-size:clamp(1.9rem,6.6vw,2.9rem);font-style:italic;line-height:1.14;font-weight:300}
.login .sub{color:var(--ink-soft);font-size:.95rem;max-width:46ch}

.who{display:flex;flex-direction:row;gap:14px;justify-content:center;}
.who-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;flex:1;text-align:center;
  padding:24px 10px;border-radius:var(--radius);background:var(--paper-2);border:1px solid var(--line);
  color:var(--ink);box-shadow:var(--shadow);transition:border-color .18s ease, transform .18s ease}
.who-btn:hover{border-color:var(--accent)}
.who-btn:active{transform:scale(.99)}
.who-btn strong{font-family:Newsreader,serif;font-size:1.35rem;font-weight:400;display:block}
.who-btn span{font-size:.85rem;color:var(--ink-soft);display:none;}
.dot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:4px}
.dot.mica{background:var(--mica)} .dot.tati{background:var(--tati)}

.pin-row{display:flex;gap:8px;margin-top:10px}
.pin-row input{flex:1;min-width:0}

input[type="password"],input[type="text"],textarea{width:100%;background:var(--paper-2);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;font:inherit;resize:vertical;transition:border-color .15s ease}
textarea{font-family:Newsreader,Georgia,serif;font-size:1.05rem;line-height:1.55;min-height:88px}
input:focus,textarea:focus{border-color:var(--accent);outline:none}
.btn{border:none;border-radius:10px;padding:12px 18px;font-weight:500;background:var(--ink);color:var(--paper);
  transition:opacity .15s ease, transform .15s ease}
.btn:hover{opacity:.88}
.btn:active{transform:scale(.985)}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line)}
.btn-sm{padding:7px 12px;font-size:.86rem;border-radius:8px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:16px;flex-wrap:wrap}
.brand{font-family:Newsreader,serif;font-style:italic;font-size:1.15rem}
.me{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--ink-soft)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:26px}
.tab{background:none;border:none;padding:10px 2px;margin-right:20px;color:var(--ink-soft);position:relative}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent)}

.card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.q{font-family:Newsreader,serif;font-style:italic;font-size:1.22rem;line-height:1.35;margin:0 0 10px;font-weight:300}
.field{margin-bottom:22px}
.bonus{border-left:2px solid var(--accent);padding-left:14px}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.mood{flex:1 1 84px;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink-soft);font-size:.84rem;text-align:center}
.mood[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--paper-2);font-weight:500}
.hint{font-size:.83rem;color:var(--ink-soft);margin:6px 0 0}

.entry{border-radius:var(--radius);border:1px solid var(--line);padding:18px 20px;background:var(--paper-2); position:relative;}
.entry.mica{border-left:3px solid var(--mica)}
.entry.tati{border-left:3px solid var(--tati)}
.entry-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.author{font-family:Newsreader,serif;font-size:1.1rem}
.author.mica{color:var(--mica)} .author.tati{color:var(--tati)}
.stamp{font-size:.78rem;color:var(--ink-soft)}
.qa{margin-bottom:14px}
.qa:last-child{margin-bottom:0}
.qa .lbl{font-family:Newsreader,serif;font-style:italic;color:var(--ink-soft);font-size:.98rem;margin-bottom:2px}
.qa .ans{font-family:Newsreader,serif;font-size:1.06rem;line-height:1.6;white-space:pre-wrap}

.decor{text-align:center; margin-top:20px; opacity:0.3;}
.decor svg {width:20px; height:20px;}

.moodchip{display:inline-block;font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--ink-soft)}
.trbar{margin-top:12px}
.tr{background:none;border:none;padding:0;color:var(--accent);font-size:.82rem;text-decoration:underline;text-underline-offset:3px}
.trnote{font-size:.76rem;color:var(--ink-soft);margin-top:4px}
.veil{position:relative}
.veil .entry{filter:blur(7px);pointer-events:none;user-select:none}
.veil-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;
  font-family:Newsreader,serif;font-style:italic;font-size:1.05rem;color:var(--ink-soft)}
@keyframes reveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.revealed{animation:reveal .5s ease both}
.reacts{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.react{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:.95rem;line-height:1.3}
.react[aria-pressed="true"]{border-color:var(--accent);background:var(--accent)}
.thread{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.msg{font-size:.92rem;margin-bottom:8px}
.msg b{font-weight:500}
.msg.mica b{color:var(--mica)} .msg.tati b{color:var(--tati)}
.msg .t{color:var(--ink-soft);font-size:.76rem;margin-left:6px}
.thread-form{display:flex;gap:8px;margin-top:10px}
.thread-form input{flex:1;min-width:0}

.day{margin-bottom:34px}
.day-label{font-family:Newsreader,serif;font-size:1.05rem;color:var(--ink-soft);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.day-label::after{content:"";flex:1;height:1px;background:var(--line)}
.pair{display:grid;gap:14px}
@media(min-width:680px){.pair.two{grid-template-columns:1fr 1fr;align-items:start}}

/* CONFIGURACIÓN BASE (CELULAR) */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 26px; }
.stat { padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper-2); }

/* NUEVO BLOQUE DE IMAGEN */
.stat-img { padding: 0; border: none; background: transparent; overflow: hidden; display: flex; }
.stat-img img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--line); }

/* CONFIGURACIÓN PARA COMPUTADORAS (Pantallas mayores a 680px) */
@media(min-width: 680px) {
  .stats { grid-template-columns: repeat(3, 1fr); }
  .stat-img { grid-column: 1 / -1; height: 180px; } /* Ocupa toda la fila de abajo */
}
.bars{display:flex;align-items:flex-end;gap:5px;height:76px;margin-top:8px}
.barcol{flex:1;display:flex;flex-direction:column-reverse;gap:2px;height:100%}
.bar{border-radius:3px;min-height:3px}
.bar.mica{background:var(--mica)} .bar.tati{background:var(--tati)}
.legend{font-size:.8rem;color:var(--ink-soft);display:flex;gap:14px;margin-top:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.notes{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.note{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper-2);font-family:Newsreader,serif;font-size:1.02rem}
.note.mica{border-left:3px solid var(--mica)} .note.tati{border-left:3px solid var(--tati)}
.note .t{display:block;font-family:"DM Sans",sans-serif;font-size:.76rem;color:var(--ink-soft);margin-top:6px}
.empty{color:var(--ink-soft);font-family:Newsreader,serif;font-style:italic}
.banner{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:.85rem;color:var(--ink-soft);margin-bottom:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:.88rem;z-index:50;box-shadow:var(--shadow)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

/* DISEÑO DEL DIARIO DESPLEGABLE */
.journal-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
.journal-details { background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); transition: all 0.2s ease; }
.journal-summary { padding: 18px 20px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; font-family: Newsreader, serif; font-size: 1.15rem; color: var(--ink); }
.journal-summary::-webkit-details-marker { display: none; } 
.journal-summary.mica { border-left: 3px solid var(--mica); border-radius: var(--radius); }
.journal-summary.tati { border-left: 3px solid var(--tati); border-radius: var(--radius); }

.journal-details[open] .journal-summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: 1px dashed var(--line); }
.journal-details[open] .icon { transform: rotate(45deg); color: var(--accent); }

.icon { font-size: 1.6rem; font-family: sans-serif; transition: transform 0.2s; color: var(--ink-soft); line-height: 0.8; font-weight: 300; }
.journal-content { padding: 16px 20px; }
.journal-content .entry { border: none; box-shadow: none; padding: 0; background: transparent; }
.journal-content .entry.mica, .journal-content .entry.tati { border-left: none; }
.journal-content .entry-head { display: none; }

/* HISTORIAL DE ÁNIMO EN TEXTO */
.mood-history-list { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-top: 12px; }
.mood-day { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 76px; padding: 10px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
.mood-date { font-size: 0.72rem; color: var(--ink-soft); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
.mood-texts { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.mood-txt { font-size: 0.85rem; font-weight: 600; font-family: Newsreader, serif; }
.mood-txt.mica { color: var(--mica); }
.mood-txt.tati { color: var(--tati); }
</style>
</head>

let tcache = {};
try { tcache = JSON.parse(ls.get("ci_tcache") || "{}"); } catch {}
const enc = new TextEncoder(); const bytes = s => enc.encode(s).length;
function chunkText(s, maxBytes = 460){
  const parts = []; let cur = "";
  for (const w of s.split(/(\s+)/)){ if (bytes(cur + w) > maxBytes && cur){ parts.push(cur); cur = w.trimStart(); } else cur += w; }
  if (cur.trim()) parts.push(cur);
  const safe = [];
  for (const p of parts){
    if (bytes(p) <= maxBytes){ safe.push(p); continue; }
    let buf = "";
    for (const ch of p){ if (bytes(buf + ch) > maxBytes){ safe.push(buf); buf = ch; } else buf += ch; }
    if (buf) safe.push(buf);
  }
  return safe.length ? safe : [s];
}

async function translate(text, from, to){
  if (!text || !text.trim() || from === to) return text;
  const key = `${from}|${to}|${text}`; if (tcache[key]) return tcache[key];
  const de = CONFIG.translateEmail ? `&de=${encodeURIComponent(CONFIG.translateEmail)}` : "";
  const out = [];
  for (const piece of chunkText(text)){
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(piece)}&langpair=${from}|${to}${de}`);
    const json = await res.json();
    const got = json && json.responseData && json.responseData.translatedText;
    if (!got || /MYMEMORY WARNING/i.test(got)) throw new Error("translation failed");
    out.push(got);
  }
  const joined = out.join(" "); tcache[key] = joined; ls.set("ci_tcache", JSON.stringify(tcache)); return joined;
}

async function translateEntry(e){
  const from = e.lang || "es", to = state.lang;
  const answers = await Promise.all((e.answers || []).map(a => translate(a, from, to)));
  const bonus = await translate(e.bonus || "", from, to);
  const cmts = {};
  for (const c of state.comments.filter(c => c.entry_id === e.id)) cmts[c.id] = await translate(c.text, c.lang || from, to);
  state.tx[e.id] = { lang: to, answers, bonus, comments: cmts };
}

function entryHTML(e, opts = {}){

function viewDiario(){

  const dates = [...new Set(state.entries.map(e => e.date))].sort().reverse();
  if (!dates.length) return `<div class="card"><p class="empty">${esc(t("emptyJournal"))}</p></div>`;
  
  return `<div class="journal-list">` + dates.map(d => {
    const mine = entryOf(d, state.me), hers = entryOf(d, other(state.me));
    const locked = d === key && !mine; 
    const items = [];
    
    const makeItem = (e, who, isLocked) => {
      const body = entryHTML(e, { reactable: !isLocked, thread: !isLocked, veiled: isLocked, veilMsg: t("veil", { name: nameOf(other(state.me)) }) });
      return `
        <details class="journal-details">
          <summary class="journal-summary ${who}">
            <span><strong>${esc(nameOf(who))}</strong>, ${esc(prettyDate(d))}</span>
            <span class="icon">+</span>
          </summary>
          <div class="journal-content">${body}</div>
        </details>`;
    };

    if (mine) items.push(makeItem(mine, state.me, false));
    if (hers) items.push(makeItem(hers, other(state.me), locked));
    
    return items.join("");
  }).join("") + `</div>`;
}
  
function viewNosotras(){
  const since = new Date(CONFIG.since + "T00:00:00Z"); const together = Math.max(0, Math.round((new Date() - since) / 86400000));
  const dates = [...new Set(state.entries.map(e => e.date))].sort();
  let streak = 0; const d = new Date(); if (!(entryOf(todayKey(), "mica") && entryOf(todayKey(), "tati"))) d.setUTCDate(d.getUTCDate() - 1);
  for (;;){ const k = `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; if (entryOf(k, "mica") && entryOf(k, "tati")){ streak++; d.setUTCDate(d.getUTCDate() - 1); } else break; }
  
  const last = dates.slice(-14); 
  
  const historyList = last.map(k => { 
    const a = entryOf(k, "mica"), b = entryOf(k, "tati"); 
    const dateObj = new Date(k + "T00:00:00Z");
    const shortDate = dateObj.toLocaleDateString(LOCALE[state.lang], { day:"numeric", month:"short", timeZone:"UTC" });
    
    const aMood = a && typeof a.mood === "number" ? `<span class="mood-txt mica">${esc(moods()[a.mood])}</span>` : "";
    const bMood = b && typeof b.mood === "number" ? `<span class="mood-txt tati">${esc(moods()[b.mood])}</span>` : "";
    
    return `<div class="mood-day"><span class="mood-date">${esc(shortDate)}</span><div class="mood-texts">${aMood}${bMood}</div></div>`;
  }).join("");

  const notes = [...state.notes].sort((a,b) => b.created_at.localeCompare(a.created_at)).slice(0, 30);
  
return `
    <div class="stats">
      <div class="stat"><span class="n">${together}</span><span class="l">${esc(t("daysTogether"))}</span></div>
      <div class="stat"><span class="n">${streak}</span><span class="l">${esc(t("streak"))}</span></div>
      <div class="stat"><span class="n">${state.entries.length}</span><span class="l">${esc(t("savedAnswers"))}</span></div>
      <div class="stat-img">
        <picture>
          <!-- Esta imagen apaisada se carga SOLO en computadora -->
          <source media="(min-width: 680px)" srcset="images/foto-pc.png">
          <!-- Esta imagen cuadrada se carga en celular -->
          <img src="images/foto-celular.png" alt="Nosotras">
        </picture>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px"><h3 style="font-size:1.25rem;margin-bottom:4px">${esc(t("howWeAre"))}</h3><p class="hint" style="margin:0 0 8px">${esc(t("moodSub", { n: last.length }))}</p>
      <h3 style="font-size:1.25rem;margin-bottom:4px">${esc(t("thinking"))}</h3>
      <p class="hint" style="margin:0 0 12px">${esc(t("notesSub"))}</p>
      <form id="noteForm" class="thread-form"><input type="text" id="noteText" maxlength="240" placeholder="${esc(t("noteHere"))}"><button class="btn btn-sm" type="submit">${esc(t("leave"))}</button></form>
      <div class="notes">
        ${notes.length ? notes.map(n => {
          const shown = state.tx["note:" + n.id] && state.txOn["note:" + n.id] && state.tx["note:" + n.id].lang === state.lang ? state.tx["note:" + n.id].text : n.text;
          const can = CONFIG.translateApi && (n.lang || "es") !== state.lang;
          return `<div class="note ${n.author}">${esc(shown)}<span class="t">${esc(nameOf(n.author))} ·${new Date(n.created_at).toLocaleString(LOCALE[state.lang], {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</span>
            ${can ? `<button class="tr" data-trnote="${n.id}" style="margin-top:6px">${esc(state.txOn["note:" + n.id] ? t("original") : t("translate"))}</button>` : ""}</div>`;
        }).join("") : `<p class="empty">${esc(t("noNotes"))}</p>`}
      </div>
    </div>`;
}

function wireUI(rerender){
  $("#langBtn")?.addEventListener("click", ev => { ev.stopPropagation(); state.langOpen = !state.langOpen; rerender(); });
  
  $("#themeBtn")?.addEventListener("click", (e) => {
    let current = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", current);
    ls.set("ci_theme", current);
    e.target.textContent = current === "dark" ? t("lightMode") : t("darkMode");
  });
  
  root.querySelectorAll(".lang-menu button").forEach(b => b.addEventListener("click", () => { state.lang = b.dataset.lang; document.documentElement.lang = state.lang; ls.set("ci_lang", state.lang); state.langOpen = false; rerender(); }));
  if (state.langOpen) document.addEventListener("click", () => { state.langOpen = false; rerender(); }, { once: true });
}

function render(){
  const inner = state.tab === "hoy" ? viewHoy() : state.tab === "diario" ? viewDiario() : viewNosotras();
  root.innerHTML = shell(inner);
  wireUI(render);
  $("#logout")?.addEventListener("click", async () => { state.me = null; state.userId = null; state.editing = false; ls.del("ci_me"); if (CONFIG.useAuth && state.store.mode === "remote"){ try { await state.store.signOut(); } catch {} } renderLogin(); });
  root.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { state.tab = b.dataset.tab; state.editing = false; render(); }));
  $("#editBtn")?.addEventListener("click", () => { state.editing = true; render(); });
  const form = $("#checkin");
  if (form){
    let mood = entryOf(todayKey(), state.me)?.mood ?? null;
    root.querySelectorAll(".mood").forEach(b => b.addEventListener("click", () => { mood = Number(b.dataset.m); root.querySelectorAll(".mood").forEach(x => x.setAttribute("aria-pressed", x === b)); }));
    form.addEventListener("submit", async ev => {
      ev.preventDefault(); const answers = questions().map((_, i) => form[`q${i}`].value.trim()); const bonus = form.bonus.value.trim();
      if (mood === null && !answers.some(Boolean) && !bonus){ toast(t("writeSomething")); return; }
      const key = todayKey(), prev = entryOf(key, state.me);
      const entry = { id: `${key}__${state.me}`, date: key, author: state.me, mood, answers, bonus, lang: state.lang, reactions: prev?.reactions || {}, created_at: prev?.created_at || new Date().toISOString(), edited: !!prev };
      try { await state.store.saveEntry(withAuthor(entry)); } catch { toast(t("saveFailed")); return; }
      state.editing = false; delete state.tx[entry.id]; await refresh(); render(); toast(prev ? t("changed") : t("saved"));
    });
  }
  root.querySelectorAll(".react[data-entry]").forEach(b => b.addEventListener("click", async () => { const e = state.entries.find(x => x.id === b.dataset.entry); if (!e) return; const r = { ...(e.reactions || {}) }; if (r[state.me] === b.dataset.r) delete r[state.me]; else r[state.me] = b.dataset.r; try { await state.store.saveEntry({ ...e, reactions: r }); } catch { toast(t("saveFailed")); return; } await refresh(); render(); }));
  root.querySelectorAll(".thread-form[data-entry]").forEach(f => f.addEventListener("submit", async ev => { ev.preventDefault(); const input = f.querySelector("input"), text = input.value.trim(); if (!text) return; try { await state.store.addComment(withAuthor({ id: uid(), entry_id: f.dataset.entry, author: state.me, text, lang: state.lang, created_at: new Date().toISOString() })); } catch { toast(t("saveFailed")); return; } delete state.tx[f.dataset.entry]; await refresh(); render(); }));
  root.querySelectorAll("[data-tr]").forEach(b => b.addEventListener("click", async () => { const id = b.dataset.tr; if (state.txOn[id]){ state.txOn[id] = false; render(); return; } const e = state.entries.find(x => x.id === id); if (!e) return; b.textContent = t("translating"); try { await translateEntry(e); state.txOn[id] = true; render(); } catch { b.textContent = t("trFailed"); } }));
  root.querySelectorAll("[data-trnote]").forEach(b => b.addEventListener("click", async () => { const n = state.notes.find(x => x.id === b.dataset.trnote); if (!n) return; const k = "note:" + n.id; if (state.txOn[k]){ state.txOn[k] = false; render(); return; } b.textContent = t("translating"); try { state.tx[k] = { lang: state.lang, text: await translate(n.text, n.lang || "es", state.lang) }; state.txOn[k] = true; render(); } catch { b.textContent = t("trFailed"); } }));
  $("#noteForm")?.addEventListener("submit", async ev => { ev.preventDefault(); const text = $("#noteText").value.trim(); if (!text) return; try { await state.store.addNote(withAuthor({ id: uid(), author: state.me, text, lang: state.lang, created_at: new Date().toISOString() })); } catch { toast(t("saveFailed")); return; } await refresh(); render(); toast(t("noteSent")); });
}

async function start(){ await refresh(); render(); }
(async function boot(){
  const savedLang = ls.get("ci_lang"); if (savedLang && LANGS[savedLang]) state.lang = savedLang; document.documentElement.lang = state.lang;
  state.store = local;
  if (CONFIG.firebase && CONFIG.firebase.apiKey && !/PEGAR_ACA/.test(CONFIG.firebase.apiKey)){ try { await remote.init(); state.store = remote; } catch { state.store = local; state.degraded = true; } }
  if (CONFIG.useAuth && state.store.mode === "remote"){ try { const user = await remote.getSession(); if (user){ const who = Object.keys(CONFIG.people).find(k => CONFIG.people[k].email === user.email); if (who){ state.me = who; state.userId = user.uid; await start(); return; } } } catch {} renderLogin(); } else { const saved = ls.get("ci_me"); if (saved && CONFIG.people[saved]){ state.me = saved; await start(); } else { renderLogin(); } }
  setInterval(async () => { if (state.store.mode !== "remote" || !state.me || state.editing) return; const before = state.entries.length + state.comments.length + state.notes.length; await refresh(); if (state.entries.length + state.comments.length + state.notes.length !== before) render(); }, 45000);
})();
</script>
</body>
</html>
